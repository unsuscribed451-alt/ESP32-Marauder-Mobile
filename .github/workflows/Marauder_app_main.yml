name: Compilar APK de Marauder

on:
  push:
    branches: [ "main", "master" ] # Se ejecuta al subir cambios a estas ramas
  workflow_dispatch: # Te permite ejecutar la compilación manualmente cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Otorgar permisos de ejecución a Gradle
      run: chmod +x gradlew

    - name: Compilar APK de Depuración (Debug) y Pruebas
      run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

    - name: Compilar APK de Lanzamiento (Release Unsigned)
      run: ./gradlew :app:assembleRelease

    - name: Guardar APKs como artefactos de descarga
      uses: actions/upload-artifact@v4
      with:
        name: Marauder-APKs
        path: app/build/outputs/apk/**/*.apk
